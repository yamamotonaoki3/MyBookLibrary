name: CI

on:
  pull_request:
  push:
    branches: [main]

defaults:
  run:
    working-directory: app

env:
  CI_RUNTIME_IMAGE: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:c091b21d9fae78c76e85cd4356431e9b018402f172a214fc7d7a5e9a7e29d8ac
  WRANGLER_SEND_METRICS: "false"
  WRANGLER_SEND_ERROR_REPORTS: "false"
  NEXT_TELEMETRY_DISABLED: "1"
  CHECKPOINT_DISABLE: "1"
  PRISMA_HIDE_UPDATE_MESSAGE: "1"
  npm_config_audit: "false"
  npm_config_fund: "false"

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Verify clean preparation inputs
        run: |
          for file in .env .env.local .env.test .dev.vars; do
            if [ -e "$file" ]; then echo "Unexpected app env input"; exit 1; fi
          done
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: D1 schema drift check
        run: npm run schema:d1:check
      - name: Docs link check
        run: npm run check:docs
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      # Acquiring the locked image supplies Chromium and OS libraries; no app is started.
      - name: Prepare runtime and test database images
        run: |
          docker pull --platform linux/amd64 "$CI_RUNTIME_IMAGE"
          docker pull --platform linux/amd64 mysql:8.4
          echo "CI_ISOLATION_RUNTIME_IMAGE=$(docker image inspect --format '{{.Id}}' "$CI_RUNTIME_IMAGE")" >> "$GITHUB_ENV"
          echo "CI_ISOLATION_MYSQL_IMAGE=$(docker image inspect --format '{{.Id}}' mysql:8.4)" >> "$GITHUB_ENV"
      # Migrations/Jest/MySQL/normal+cron+demo+PWA E2E/build all run in the none namespace.
      - name: Isolated application tests
        id: isolated
        run: node scripts/run-ci-isolated.mjs test
      # Publish only validated owned output. Missing required reports fail the runner;
      # valid partial coverage/reports can still be recovered when a suite fails.
      - name: Upload coverage report
        if: always() && steps.isolated.outputs.artifacts != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ${{ steps.isolated.outputs.artifacts }}/reports/coverage
          retention-days: 7
      - name: Upload Playwright report
        if: always() && steps.isolated.outputs.artifacts != ''
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            ${{ steps.isolated.outputs.artifacts }}/reports/playwright-report
            ${{ steps.isolated.outputs.artifacts }}/reports/playwright-report-pwa
          retention-days: 7
      - name: Upload isolation evidence
        if: always() && steps.isolated.outputs.artifacts != ''
        uses: actions/upload-artifact@v4
        with:
          name: test-isolation-evidence
          path: |
            ${{ steps.isolated.outputs.artifacts }}/suite-result.json
            ${{ steps.isolated.outputs.artifacts }}/host-result.json
            ${{ steps.isolated.outputs.artifacts }}/logs
          retention-days: 7

  integration-d1:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Verify clean preparation inputs
        run: |
          for file in .env .env.local .env.test .dev.vars; do
            if [ -e "$file" ]; then echo "Unexpected app env input"; exit 1; fi
          done
      - name: Install dependencies
        run: npm ci
      - name: Prepare runtime image
        run: |
          docker pull --platform linux/amd64 "$CI_RUNTIME_IMAGE"
          echo "CI_ISOLATION_RUNTIME_IMAGE=$(docker image inspect --format '{{.Id}}' "$CI_RUNTIME_IMAGE")" >> "$GITHUB_ENV"
      - name: Integration test (D1, isolated)
        id: isolated
        run: node scripts/run-ci-isolated.mjs integration-d1
      - name: Upload D1 isolation evidence
        if: always() && steps.isolated.outputs.artifacts != ''
        uses: actions/upload-artifact@v4
        with:
          name: d1-isolation-evidence
          path: |
            ${{ steps.isolated.outputs.artifacts }}/suite-result.json
            ${{ steps.isolated.outputs.artifacts }}/host-result.json
            ${{ steps.isolated.outputs.artifacts }}/logs
          retention-days: 7

  worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Verify clean preparation inputs
        run: |
          for file in .env .env.local .env.test .dev.vars; do
            if [ -e "$file" ]; then echo "Unexpected app env input"; exit 1; fi
          done
      - name: Install dependencies
        run: npm ci
      - name: Prepare runtime image
        run: |
          docker pull --platform linux/amd64 "$CI_RUNTIME_IMAGE"
          echo "CI_ISOLATION_RUNTIME_IMAGE=$(docker image inspect --format '{{.Id}}' "$CI_RUNTIME_IMAGE")" >> "$GITHUB_ENV"
      # Build/dry-run size/staging/demo config checks and local smoke stay in this job.
      - name: Worker build and smoke (isolated)
        id: isolated
        run: node scripts/run-ci-isolated.mjs worker
      - name: Upload Worker isolation evidence
        if: always() && steps.isolated.outputs.artifacts != ''
        uses: actions/upload-artifact@v4
        with:
          name: worker-isolation-evidence
          path: |
            ${{ steps.isolated.outputs.artifacts }}/suite-result.json
            ${{ steps.isolated.outputs.artifacts }}/host-result.json
            ${{ steps.isolated.outputs.artifacts }}/logs
          retention-days: 7
